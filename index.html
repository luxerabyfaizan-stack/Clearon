<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEARON ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if(!window.supabase){
  document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\\/script>');
}
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.top{height:64px;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{font-size:22px;font-weight:800;letter-spacing:.5px}.brand small{font-size:11px;opacity:.6;margin-left:7px}
.wrap{display:flex;min-height:calc(100vh - 64px)}aside{width:220px;background:#111827;color:#dbe4f0;padding:14px;position:fixed;top:64px;bottom:0;overflow:auto}
main{margin-left:220px;width:calc(100% - 220px);padding:22px;max-width:1500px}.navbtn{width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:9px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#263247;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:17px;box-shadow:0 3px 14px #1118270a}.kpi{font-size:13px;color:#64748b}.val{font-size:25px;font-weight:800;margin-top:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{margin-bottom:14px}.primary{background:#0f766e;color:#fff;padding:10px 14px;border-radius:9px}.danger{background:#dc2626;color:#fff;padding:8px 11px;border-radius:8px}.ghost{background:#e8edf3;color:#172033;padding:9px 12px;border-radius:8px}
table{width:100%;border-collapse:collapse;background:#fff}.tablewrap{overflow:auto;border:1px solid #e4e8ef;border-radius:12px}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}th{background:#f8fafc;font-size:12px;color:#64748b}td{font-size:13px}
h1{font-size:27px;margin:0 0 5px}h2{font-size:19px;margin:0 0 15px}.muted{color:#64748b;font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cfd7e3;border-radius:8px;background:#fff}.field textarea{min-height:80px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:50}.modalbox{background:#fff;border-radius:15px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;z-index:100;box-shadow:0 10px 30px #0003}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07111f,#123b45)}.loginbox{width:min(430px,92%);background:#fff;padding:28px;border-radius:18px}.loginbox h1{color:#0f766e}.loginbox .field{margin:12px 0}.loginbox button{width:100%;margin-top:8px}
.itemrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:8px 0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f5f2;color:#0f766e;font-size:11px;font-weight:700}
@media(max-width:900px){aside{width:0;padding:0;overflow:hidden}main{margin-left:0;width:100%;padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.itemrow{grid-template-columns:1fr 80px 100px auto}.top{padding:0 14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.val{font-size:19px}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="loginbox">
  <h1>CLEARON ERP</h1><p class="muted">Fresh Supabase setup. One simple system for sales, purchases, stock and company money.</p>
  <div class="field"><label>Supabase Project URL</label><input id="url" placeholder="https://xxxxxxxx.supabase.co"></div>
  <div class="field"><label>Publishable / anon key</label><input id="key" type="password" placeholder="eyJ..."></div>
  <div class="field"><label>Your email</label><input id="email" type="email"></div>
  <div class="field"><label>Password</label><input id="password" type="password"></div>
  <div class="field"><label>Your name (only needed for Sign Up)</label><input id="fullname" placeholder="Faizan"></div>
  <button type="button" class="primary" onclick="signIn()">Login</button>
  <button type="button" class="ghost" style="width:100%;margin-top:8px" onclick="signUp()">Create Account</button>
  <p id="loginmsg" class="muted"></p><p id="jsstatus" class="muted" style="font-size:11px">System loading...</p>
 </div>
</div>

<div id="app" class="hidden">
<header class="top"><div class="brand">CLEARON <small>ERP</small></div><div class="row"><span id="userlabel" class="muted" style="color:#cbd5e1"></span><button type="button" class="ghost" onclick="logout()">Logout</button></div></header>
<div class="wrap">
<aside id="nav"></aside>
<main id="main"></main>
</div>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const $=id=>document.getElementById(id);
let sb=null, currentUser=null, currentSection='dashboard';
const money=n=>'PKR '+Number(n||0).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg,bad=false){$('toast').textContent=msg;$('toast').classList.remove('hidden');$('toast').style.background=bad?'#b91c1c':'#172033';setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function saveConn(){localStorage.setItem('clearon_url',$('url').value.trim().replace(/\/+$/,''));localStorage.setItem('clearon_key',$('key').value.trim())}
function loadConn(){$('url').value=localStorage.getItem('clearon_url')||'';$('key').value=localStorage.getItem('clearon_key')||''}
function initClient(){let u=$('url').value.trim().replace(/\/+$/,''),k=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))throw Error('Project URL must look like https://xxxx.supabase.co (no /rest/v1/)');if(!k)throw Error('Enter your publishable/anon key');sb=window.supabase.createClient(u,k,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});saveConn()}
async function signUp(){
 try{
  if(!window.supabase) throw Error('Supabase library did not load. Refresh the page or check internet connection.');
  initClient();
  let e=$('email').value.trim(),p=$('password').value,n=$('fullname').value.trim();
  if(!e||p.length<6) throw Error('Enter email and password (minimum 6 characters)');
  $('loginmsg').textContent='Creating account...';
  let {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});
  if(error) throw error;
  $('loginmsg').textContent=data.session?'Account created.':'Account created. Check your email if confirmation is enabled.';
  if(data.session) await boot(data.session.user);
 }catch(e){$('loginmsg').textContent=e.message;toast(e.message,true)}
}
async function signIn(){
 try{
  if(!window.supabase) throw Error('Supabase library did not load. Refresh the page or check internet connection.');
  initClient();
  let e=$('email').value.trim(),p=$('password').value;
  if(!e||!p) throw Error('Enter email and password');
  $('loginmsg').textContent='Connecting...';
  let {data,error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error) throw error;
  await boot(data.user);
 }catch(e){$('loginmsg').textContent=e.message;toast(e.message,true)}
}
async function boot(user){currentUser=user; $('login').classList.add('hidden');$('app').classList.remove('hidden');$('userlabel').textContent=user.email||'';buildNav();await show('dashboard')}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
function buildNav(){let items=[['dashboard','Dashboard'],['sales','Sales'],['purchases','Purchases'],['inventory','Inventory'],['products','Products'],['customers','Customers'],['suppliers','Suppliers'],['expenses','Expenses'],['capital','Capital'],['cash','Cash & Bank'],['reports','Reports'],['settings','Settings']];$('nav').innerHTML=items.map(x=>`<button type="button" class="navbtn" data-s="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
async function show(s){currentSection=s;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.s===s));$('main').innerHTML='<div class="card">Loading...</div>';try{if(s==='dashboard')await dashboard();else if(s==='sales')await sales();else if(s==='purchases')await purchases();else if(s==='inventory')await inventory();else if(s==='products')await products();else if(s==='customers')await simpleMaster('customers','Customers',['name','phone','address','opening_balance','credit_limit']);else if(s==='suppliers')await simpleMaster('suppliers','Suppliers',['name','phone','address','opening_balance']);else if(s==='expenses')await expenses();else if(s==='capital')await capital();else if(s==='cash')await cash();else if(s==='reports')await reports();else if(s==='settings')await settings()}catch(e){$('main').innerHTML=`<div class="card"><h2>Could not load this section</h2><p class="muted">${esc(e.message)}</p><button type="button" class="primary" onclick="show('${s}')">Try Again</button></div>`}}
async function q(t,cols='*',order='created_at'){let x=sb.from(t).select(cols);if(order)x=x.order(order,{ascending:false});let r=await x.limit(1000);if(r.error)throw r.error;return r.data||[]}
async function rpc(name,args){let r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}
async function count(t){let r=await sb.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;return r.count||0}
function openModal(title,body,buttons=''){ $('modalbox').innerHTML=`<div class="row between"><h2>${esc(title)}</h2><button type="button" class="ghost" onclick="closeModal()">Close</button></div>${body}<div class="row" style="margin-top:15px;justify-content:flex-end">${buttons}</div>`;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function f(label,id,type='text',extra=''){return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type}" ${extra}></div>`}
function select(id,label,items,placeholder='Select'){return `<div class="field"><label>${esc(label)}</label><select id="${id}"><option value="">${placeholder}</option>${items.map(x=>`<option value="${x.id}">${esc(x.name||x.sku||x.id)}</option>`).join('')}</select></div>`}
async function dashboard(){let d=(await q('v_dashboard','*',null))[0]||{};let cards=[['Sales',money(d.revenue)],['Gross Profit',money(d.gross_profit)],['Expenses',money(d.expenses)],['Stock Value',money(d.inventory_value)],['Receivables',money(d.receivables)],['Payables',money(d.payables)],['Cash / Bank',money(d.cash_bank)],['Net Investment',money(d.net_investment)]];$('main').innerHTML=`<h1>Dashboard</h1><p class="muted">CLEARON company overview</p><div class="grid" style="margin-top:15px">${cards.map(c=>`<div class="card"><div class="kpi">${c[0]}</div><div class="val">${c[1]}</div></div>`).join('')}</div><div class="grid" style="margin-top:14px"><div class="card"><div class="kpi">Customers</div><div class="val">${d.customers||0}</div></div><div class="card"><div class="kpi">Products</div><div class="val">${d.products||0}</div></div><div class="card"><div class="kpi">Estimated Net Business Value</div><div class="val">${money(Number(d.cash_bank||0)+Number(d.inventory_value||0)+Number(d.receivables||0)-Number(d.payables||0))}</div><p class="muted">Management estimate: cash + stock + receivables − payables.</p></div><div class="card"><div class="kpi">Usable Funds</div><div class="val">${money(Math.max(Number(d.cash_bank||0)-Number(d.payables||0),0))}</div><p class="muted">Simple cash/bank less recorded supplier dues.</p></div></div>`}
async function products(){let rows=await q('products');$('main').innerHTML=`<div class="row between actions"><div><h1>Products</h1><p class="muted">Add your bottles, prices and cost.</p></div><button type="button" class="primary" onclick="productForm()">+ Add Product</button></div><div class="tablewrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Unit</th><th>Sale Price</th><th>Cost</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${esc(r.unit)}</td><td>${money(r.selling_price)}</td><td>${money(r.cost_price)}</td><td><button type="button" class="danger" onclick="del('products','id','${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function productForm(){openModal('Add Product',`<div class="formgrid">${f('SKU','sku')} ${f('Product name','name')} ${f('Category','category')} ${f('Unit','unit')} ${f('Selling price','selling','number','step="0.01"')} ${f('Cost price','cost','number','step="0.01"')} ${f('Opening stock','opening','number','step="0.001"')}</div>`,`<button type="button" class="primary" onclick="saveProduct()">Save</button>`)}
async function saveProduct(){try{let o={sku:$('sku').value.trim(),name:$('name').value.trim(),category:$('category').value.trim()||'Finished Goods',unit:$('unit').value.trim()||'bottle',selling_price:+$('selling').value||0,cost_price:+$('cost').value||0,opening_stock:+$('opening').value||0};if(!o.sku||!o.name)throw Error('SKU and product name are required');let r=await sb.from('products').insert(o);if(r.error)throw r.error;closeModal();toast('Product saved');show('products')}catch(e){toast(e.message,true)}}
async function simpleMaster(table,title,fields){let rows=await q(table);$('main').innerHTML=`<div class="row between actions"><div><h1>${title}</h1><p class="muted">Simple master data.</p></div><button type="button" class="primary" onclick="masterForm('${table}','${title}')">+ Add ${title.slice(0,-1)}</button></div><div class="tablewrap"><table><thead><tr>${fields.map(x=>`<th>${esc(x)}</th>`).join('')}<th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(x=>`<td>${x.includes('balance')||x.includes('limit')?money(r[x]):esc(r[x])}</td>`).join('')}<td><button type="button" class="danger" onclick="del('${table}','id','${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function masterForm(table,title){let isC=table==='customers';let fields=isC?[['name','Name','text'],['phone','Phone','text'],['address','Address','text'],['opening_balance','Opening Balance','number'],['credit_limit','Credit Limit','number']]:[['name','Name','text'],['phone','Phone','text'],['address','Address','text'],['opening_balance','Opening Balance','number']];openModal('Add '+title.slice(0,-1),`<div class="formgrid">${fields.map(x=>f(x[1],x[0],x[2],x[2]==='number'?'step="0.01"':'')).join('')}</div>`,`<button type="button" class="primary" onclick="saveMaster('${table}')">Save</button>`)}
async function saveMaster(table){try{let o={name:$('name').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),opening_balance:+$('opening_balance').value||0};if(table==='customers')o.credit_limit=+$('credit_limit').value||0;if(!o.name)throw Error('Name is required');let r=await sb.from(table).insert(o);if(r.error)throw r.error;closeModal();toast('Saved');show(table)}catch(e){toast(e.message,true)}}
async function inventory(){let rows=await q('v_inventory','*',null);$('main').innerHTML=`<div class="row between actions"><div><h1>Inventory</h1><p class="muted">Live stock from purchases, sales and adjustments.</p></div><button type="button" class="primary" onclick="adjustForm()">Stock Adjustment</button></div><div class="tablewrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Stock</th><th>Unit</th><th>Cost</th><th>Stock Value</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${Number(r.stock_qty||0).toLocaleString()}</td><td>${esc(r.unit)}</td><td>${money(r.cost_price)}</td><td>${money(r.stock_value)}</td></tr>`).join('')}</tbody></table></div>`}
async function adjustForm(){let ps=await q('products');openModal('Stock Adjustment',`${select('ap','Product',ps)}<div class="formgrid">${f('Quantity (+ in / - out)','aq','number','step="0.001"')}${f('Note','anote')}</div>`,`<button type="button" class="primary" onclick="saveAdjustment()">Save</button>`)}
async function saveAdjustment(){try{let r=await rpc('record_stock_adjustment',{p_product:$('ap').value,p_qty:+$('aq').value,p_note:$('anote').value});closeModal();toast('Stock adjusted');show('inventory')}catch(e){toast(e.message,true)}}
async function sales(){let rows=await q('sales');$('main').innerHTML=`<div class="row between actions"><div><h1>Sales</h1><p class="muted">Post a sale; stock is reduced automatically and negative stock is blocked.</p></div><button type="button" class="primary" onclick="saleForm()">+ New Sale</button></div><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.invoice_no)}</td><td>${r.sale_date}</td><td>${esc(r.customer_id||'Cash Customer')}</td><td>${money(r.total)}</td><td>${money(r.paid)}</td><td>${money(r.due)}</td><td><span class="pill">${r.status}</span></td></tr>`).join('')}</tbody></table></div>`}
async function saleForm(){let [ps,cs]=await Promise.all([q('products'),q('customers')]);let opts=ps.map(p=>`<option value="${p.id}" data-price="${p.selling_price}">${esc(p.name)} (${esc(p.sku)})</option>`).join('');openModal('New Sale',`${select('sc','Customer',cs,'Cash / Walk-in')}<div class="field"><label>Sale Date</label><input id="sdate" type="date" value="${today()}"></div><div id="saleitems"></div><button type="button" class="ghost" onclick="addSaleRow()">+ Add Item</button><div class="formgrid" style="margin-top:12px">${f('Discount','sdisc','number','step="0.01" value="0"')}${f('Paid','spaid','number','step="0.01" value="0"')}${f('Notes','snotes')}</div>`,`<button type="button" class="primary" onclick="saveSale()">Post Sale</button>`);window._saleProducts=ps;addSaleRow()}
function addSaleRow(){let div=document.createElement('div');div.className='itemrow';div.innerHTML=`<select class="si-product" onchange="this.parentElement.querySelector('.si-price').value=this.selectedOptions[0]?.dataset.price||0"><option value="">Product</option>${window._saleProducts.map(p=>`<option value="${p.id}" data-price="${p.selling_price}">${esc(p.name)}</option>`).join('')}</select><input class="si-qty" type="number" min="0.001" step="0.001" value="1"><input class="si-price" type="number" min="0" step="0.01" value="0"><button type="button" class="danger" onclick="this.parentElement.remove()">X</button>`;$('saleitems').appendChild(div)}
async function saveSale(){try{let lines=[...document.querySelectorAll('.itemrow')].map(r=>({product_id:r.querySelector('.si-product').value,qty:+r.querySelector('.si-qty').value,unit_price:+r.querySelector('.si-price').value})).filter(x=>x.product_id);if(!lines.length)throw Error('Add at least one product');await rpc('record_sale',{p_customer:$('sc').value||null,p_lines:lines,p_paid:+$('spaid').value||0,p_discount:+$('sdisc').value||0,p_date:$('sdate').value,p_notes:$('snotes').value});closeModal();toast('Sale posted');show('sales')}catch(e){toast(e.message,true)}}
async function purchases(){let rows=await q('purchases');$('main').innerHTML=`<div class="row between actions"><div><h1>Purchases</h1><p class="muted">Receive stock and record supplier payable automatically.</p></div><button type="button" class="primary" onclick="purchaseForm()">+ New Purchase</button></div><div class="tablewrap"><table><thead><tr><th>Bill</th><th>Date</th><th>Supplier</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.bill_no)}</td><td>${r.purchase_date}</td><td>${esc(r.supplier_id||'')}</td><td>${money(r.total)}</td><td>${money(r.paid)}</td><td>${money(r.due)}</td></tr>`).join('')}</tbody></table></div>`}
async function purchaseForm(){let [ps,ss]=await Promise.all([q('products'),q('suppliers')]);openModal('New Purchase',`${select('ps','Supplier',ss,'Select Supplier')}<div class="field"><label>Purchase Date</label><input id="pdate" type="date" value="${today()}"></div><div id="purchaseitems"></div><button type="button" class="ghost" onclick="addPurchaseRow()">+ Add Item</button><div class="formgrid" style="margin-top:12px">${f('Paid','ppaid','number','step="0.01" value="0"')}${f('Notes','pnotes')}</div>`,`<button type="button" class="primary" onclick="savePurchase()">Post Purchase</button>`);window._purchaseProducts=ps;addPurchaseRow()}
function addPurchaseRow(){let div=document.createElement('div');div.className='itemrow';div.innerHTML=`<select class="pi-product"><option value="">Product</option>${window._purchaseProducts.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input class="pi-qty" type="number" min="0.001" step="0.001" value="1"><input class="pi-cost" type="number" min="0" step="0.01" value="0"><button type="button" class="danger" onclick="this.parentElement.remove()">X</button>`;$('purchaseitems').appendChild(div)}
async function savePurchase(){try{let lines=[...document.querySelectorAll('#purchaseitems .itemrow')].map(r=>({product_id:r.querySelector('.pi-product').value,qty:+r.querySelector('.pi-qty').value,unit_cost:+r.querySelector('.pi-cost').value})).filter(x=>x.product_id);if(!lines.length)throw Error('Add at least one product');await rpc('record_purchase',{p_supplier:$('ps').value||null,p_lines:lines,p_paid:+$('ppaid').value||0,p_date:$('pdate').value,p_notes:$('pnotes').value});closeModal();toast('Purchase posted');show('purchases')}catch(e){toast(e.message,true)}}
async function expenses(){let rows=await q('expenses');$('main').innerHTML=`<div class="row between actions"><div><h1>Expenses</h1><p class="muted">Every expense posts to cash automatically.</p></div><button type="button" class="primary" onclick="expenseForm()">+ Add Expense</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.expense_date}</td><td>${esc(r.category)}</td><td>${esc(r.description)}</td><td>${money(r.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function expenseForm(){openModal('Add Expense',`<div class="formgrid">${f('Category','ecat')}${f('Amount','eamt','number','step="0.01" min="0.01"')}${f('Date','edate','date',`value="${today()}"`)}${f('Description','edesc')}</div>`,`<button type="button" class="primary" onclick="saveExpense()">Save</button>`)}
async function saveExpense(){try{await rpc('record_expense',{p_category:$('ecat').value.trim(),p_amount:+$('eamt').value,p_date:$('edate').value,p_description:$('edesc').value});closeModal();toast('Expense saved');show('expenses')}catch(e){toast(e.message,true)}}
async function capital(){let rows=await q('capital_ledger');$('main').innerHTML=`<div class="row between actions"><div><h1>Capital</h1><p class="muted">Track owner/partner/investor money separately from expenses.</p></div><button type="button" class="primary" onclick="capitalForm()">+ Add Investment</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Person</th><th>Type</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.entry_date}</td><td>${esc(r.person)}</td><td>${r.entry_type}</td><td>${money(r.amount)}</td><td>${esc(r.notes)}</td></tr>`).join('')}</tbody></table></div>`}
function capitalForm(){openModal('Add Capital Investment',`<div class="formgrid">${f('Person','cperson','text','placeholder="Faizan / Working Partner / Investor"')}${f('Amount','camount','number','step="0.01"')}${f('Date','cdate','date',`value="${today()}"`)}${f('Notes','cnotes')}</div>`,`<button type="button" class="primary" onclick="saveCapital()">Save</button>`)}
async function saveCapital(){try{await rpc('record_capital',{p_person:$('cperson').value.trim(),p_amount:+$('camount').value,p_date:$('cdate').value,p_notes:$('cnotes').value});closeModal();toast('Investment recorded');show('capital')}catch(e){toast(e.message,true)}}
async function cash(){let rows=await q('cash_entries');$('main').innerHTML=`<div class="row between actions"><div><h1>Cash & Bank</h1><p class="muted">Manual money in/out plus automatic sale, purchase, expense and capital entries.</p></div><button type="button" class="primary" onclick="cashForm()">+ Manual Entry</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.entry_date}</td><td>${r.account}</td><td>${r.entry_type}</td><td>${esc(r.category)}</td><td>${esc(r.description)}</td><td>${money(r.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function cashForm(){openModal('Manual Cash Entry',`<div class="formgrid">${`<div class="field"><label>Account</label><select id="ca"><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option><option>Other</option></select></div><div class="field"><label>Type</label><select id="ct"><option value="in">Money In</option><option value="out">Money Out</option></select></div>`}${f('Category','ccat')}${f('Amount','camt','number','step="0.01"')}${f('Date','cdate2','date',`value="${today()}"`)}${f('Description','cdesc')}</div>`,`<button type="button" class="primary" onclick="saveCash()">Save</button>`)}
async function saveCash(){try{await rpc('record_cash',{p_account:$('ca').value,p_type:$('ct').value,p_category:$('ccat').value.trim(),p_amount:+$('camt').value,p_date:$('cdate2').value,p_description:$('cdesc').value});closeModal();toast('Cash entry saved');show('cash')}catch(e){toast(e.message,true)}}
async function reports(){let [s,e,p,c]=await Promise.all([q('sales'),q('expenses'),q('purchases'),q('v_inventory','*',null)]);let rev=s.filter(x=>x.status==='posted').reduce((a,x)=>a+Number(x.total||0),0),exp=e.reduce((a,x)=>a+Number(x.amount||0),0),pur=p.filter(x=>x.status==='posted').reduce((a,x)=>a+Number(x.total||0),0),stock=c.reduce((a,x)=>a+Number(x.stock_value||0),0);$('main').innerHTML=`<h1>Reports</h1><p class="muted">Current totals from the database.</p><div class="grid" style="margin-top:15px"><div class="card"><div class="kpi">Sales</div><div class="val">${money(rev)}</div></div><div class="card"><div class="kpi">Purchases</div><div class="val">${money(pur)}</div></div><div class="card"><div class="kpi">Expenses</div><div class="val">${money(exp)}</div></div><div class="card"><div class="kpi">Stock Value</div><div class="val">${money(stock)}</div></div></div>`}
async function settings(){let r=(await q('company_settings','*',null))[0]||{};$('main').innerHTML=`<h1>Settings</h1><p class="muted">Company information.</p><div class="card" style="margin-top:15px"><div class="formgrid">${f('Company Name','cn','text',`value="${esc(r.company_name||'CLEARON')}"`)}${f('Phone','cphone','text',`value="${esc(r.phone||'')}"`)}${f('Currency','ccurrency','text',`value="${esc(r.currency||'PKR')}"`)}${f('Address','caddress','text',`value="${esc(r.address||'')}"`)}</div><button type="button" class="primary" style="margin-top:12px" onclick="saveSettings()">Save Settings</button></div><div class="card" style="margin-top:15px"><b>Important</b><p class="muted">Keep your Supabase service_role key private. This browser app only needs the publishable/anon key and authenticated RLS access.</p></div>`}
async function saveSettings(){let r=await sb.from('company_settings').update({company_name:$('cn').value,phone:$('cphone').value,currency:$('ccurrency').value,address:$('caddress').value,updated_at:new Date().toISOString()}).eq('id',true);if(r.error)toast(r.error.message,true);else toast('Settings saved')}
async function del(table,key,id){if(!confirm('Delete this record?'))return;let r=await sb.from(table).delete().eq(key,id);if(r.error)toast(r.error.message,true);else{toast('Deleted');show(currentSection)}}
(async()=>{
 try{
  loadConn();
  if(window.supabase){
   $('jsstatus').textContent='System ready';
   $('jsstatus').style.color='#0f766e';
  }else{
   $('jsstatus').textContent='Supabase library not loaded. Refresh this page.';
   $('jsstatus').style.color='#b91c1c';
  }
  if(localStorage.getItem('clearon_url')&&localStorage.getItem('clearon_key')&&window.supabase){
   initClient();
   let r=await sb.auth.getSession();
   if(r.data.session) await boot(r.data.session.user);
  }
 }catch(e){
  console.error(e);
  $('loginmsg').textContent=e.message;
 }
})();
</script>
