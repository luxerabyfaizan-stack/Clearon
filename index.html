<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEARON ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1677d2;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e4e9f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff}
button.secondary{background:#edf3fa;color:#1c3554}button.danger{background:#d64545}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(420px,100%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #173a5b18}
.logo{font-size:28px;font-weight:800;color:var(--blue)}.muted{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:22px}.nav button{background:transparent;color:#40516a;text-align:left}.nav button.active,.nav button:hover{background:#edf5ff;color:var(--blue)}
.main{padding:22px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat{font-size:25px;font-weight:800;margin-top:7px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{width:auto}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.toast{position:fixed;right:18px;bottom:18px;background:#182333;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:10}.hidden{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid,.formgrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:12px}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="box">
  <div class="logo">CLEARON</div><h2>Business ERP</h2><p class="muted">Simple screen. Real Supabase database.</p>
  <div class="field"><label>Email</label><input id="email" type="email" placeholder="owner@email.com"></div><br>
  <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><br>
  <button onclick="login()">Login</button>
  <button class="secondary" onclick="signup()">Create account</button>
  <p id="loginMsg" class="muted"></p>
 </div>
</div>
<div id="app" class="hidden">
 <div class="layout">
  <aside class="side">
   <div class="logo">CLEARON</div><div class="muted">Simple ERP</div>
   <div class="nav" id="nav"></div>
   <br><button class="secondary" onclick="logout()">Logout</button>
  </aside>
  <main class="main">
   <div class="top"><div><h2 id="title" style="margin:0">Dashboard</h2><div class="muted" id="sub">Your business at a glance</div></div><div id="who" class="muted"></div></div>
   <div id="content"></div>
  </main>
 </div>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL=localStorage.getItem('CLEARON_SUPABASE_URL')||'';
const SUPABASE_KEY=localStorage.getItem('CLEARON_SUPABASE_KEY')||'';
let sb=null, user=null;
const menus=[
 ['dashboard','Dashboard'],['sales','Sales'],['customers','Customers'],['purchases','Purchases'],
 ['production','Production'],['inventory','Inventory'],['delivery','Delivery'],
 ['expenses','Expenses'],['cash','Cash & Bank'],['people','Employees'],
 ['partners','Partners'],['investors','Investors'],['reports','Reports'],['settings','Settings']
];
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(x){return 'PKR '+Number(x||0).toLocaleString()}
function setMsg(x){document.getElementById('loginMsg').textContent=x}
async function init(){
 if(!SUPABASE_URL||!SUPABASE_KEY){setMsg('Set CLEARON_SUPABASE_URL and CLEARON_SUPABASE_KEY in browser storage first.');return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const r=await sb.auth.getSession(); if(r.data.session) start(r.data.session.user);
 sb.auth.onAuthStateChange((_e,s)=>s?start(s.user):showLogin());
}
async function login(){if(!sb)return setMsg('Supabase settings missing.');setMsg('Logging in...');const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});setMsg(error?error.message:'')}
async function signup(){if(!sb)return setMsg('Supabase settings missing.');setMsg('Creating account...');const {error}=await sb.auth.signUp({email:email.value,password:password.value,data:{full_name:'CLEARON User'}});setMsg(error?error.message:'Account created. Check email if confirmation is enabled.')}
async function logout(){await sb.auth.signOut()}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
async function start(u){user=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.email;renderNav();open('dashboard')}
function renderNav(){nav.innerHTML=menus.map(x=>`<button id="n-${x[0]}" onclick="open('${x[0]}')">${x[1]}</button>`).join('')}
async function q(table,opts={}){let z=sb.from(table).select(opts.select||'*');if(opts.limit)z=z.limit(opts.limit);if(opts.order)z=z.order(opts.order,{ascending:false});return z}
async function open(page){
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');
 const names=Object.fromEntries(menus);title.textContent=names[page]||page;
 try{
  if(page==='dashboard') return dashboard();
  if(page==='sales') return listSales();
  if(page==='customers') return simpleList('customers','Customers',['name','phone','credit_limit']);
  if(page==='purchases') return listPurchases();
  if(page==='production') return production();
  if(page==='inventory') return inventory();
  if(page==='delivery') return simpleList('deliveries','Deliveries',['delivery_no','status','delivered_value','delivery_cost']);
  if(page==='expenses') return simpleList('expenses','Expenses',['category','description','amount','expense_date']);
  if(page==='cash') return simpleList('cash_transactions','Cash Transactions',['direction','amount','category','transaction_date']);
  if(page==='people') return simpleList('employees','Employees',['name','designation','monthly_salary']);
  if(page==='partners') return simpleList('partners','Partners',['name','share_pct','active']);
  if(page==='investors') return simpleList('investors','Investors',['name','phone','active']);
  if(page==='reports') return reports();
  if(page==='settings') return settings();
 }catch(e){toast(e.message||'Something went wrong')}
}
async function dashboard(){
 const {data:d,error}=await sb.from('v_dashboard').select('*').single();if(error)throw error;
 content.innerHTML=`<div class="grid">
 <div class="card"><div class="muted">Sales</div><div class="stat">${money(d.revenue)}</div></div>
 <div class="card"><div class="muted">COGS</div><div class="stat">${money(d.cogs)}</div></div>
 <div class="card"><div class="muted">Expenses</div><div class="stat">${money(d.expenses)}</div></div>
 <div class="card"><div class="muted">Receivables</div><div class="stat">${money(d.receivables)}</div></div></div>
 <br><div class="panel"><h3>Quick actions</h3><div class="toolbar">
 <button onclick="open('sales')">New Sale</button><button onclick="open('purchases')">New Purchase</button><button onclick="open('production')">Production</button><button onclick="open('expenses')">Add Expense</button>
 </div><p class="muted">Every stock and money change is recorded as a database transaction.</p></div>`;
}
async function simpleList(table,label,cols){
 const {data,error}=await q(table,{order:'created_at',limit:100});if(error)throw error;
 content.innerHTML=`<div class="panel"><div class="toolbar"><input id="search" placeholder="Search..." oninput="filterRows()"><button onclick="showForm('${table}')">+ Add</button></div><div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="rows">${(data||[]).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function filterRows(){const s=(search.value||'').toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(s)?'':'none')}
async function inventory(){
 const {data,error}=await sb.from('v_inventory').select('*').order('name');if(error)throw error;
 content.innerHTML=`<div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Type</th><th>Unit</th><th>Stock</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${esc(r.unit)}</td><td><b>${Number(r.stock||0).toLocaleString()}</b></td></tr>`).join('')}</tbody></table></div></div>`;
}
async function listSales(){return simpleList('sales','Sales',['invoice_no','customer_id','status','total','paid','balance','sale_date'])}
async function listPurchases(){return simpleList('purchases','Purchases',['grn_no','supplier_id','status','total','paid','balance','purchase_date'])}
async function production(){
 const {data,error}=await sb.from('products').select('id,sku,name,type').eq('type','finished').order('name');if(error)throw error;
 content.innerHTML=`<div class="panel"><h3>Complete Production</h3><p class="muted">Select a finished product and quantity. The active BOM is consumed automatically.</p>
 <div class="formgrid"><div class="field"><label>Product</label><select id="prod">${data.map(x=>`<option value="${x.id}">${esc(x.sku)} — ${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Quantity</label><input id="prodqty" type="number" min="1" value="100"></div>
 <div class="field"><label>Expiry</label><input id="expiry" type="date"></div></div><br><button onclick="doProduction()">Complete Production</button></div>
 <br><div class="panel"><h3>Recent Batches</h3><div id="batches"></div></div>`;
 const b=await sb.from('batches').select('*').order('manufactured_on',{ascending:false}).limit(30);
 batches.innerHTML='<div class="tablewrap"><table class="table"><tr><th>Batch</th><th>Product</th><th>Qty</th><th>Date</th><th>Status</th></tr>'+((b.data||[]).map(x=>`<tr><td>${x.batch_no}</td><td>${x.product_id}</td><td>${x.qty}</td><td>${x.manufactured_on}</td><td>${x.status}</td></tr>`).join(''))+'</table></div>';
}
async function doProduction(){const {data,error}=await sb.rpc('complete_production',{p_product:prod.value,p_qty:Number(prodqty.value),p_expiry:expiry.value||null});if(error)toast(error.message);else{toast('Production completed: '+data);production()}}
async function reports(){
 const {data:d,error}=await sb.from('v_dashboard').select('*').single();if(error)throw error;
 content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Revenue</div><div class="stat">${money(d.revenue)}</div></div><div class="card"><div class="muted">COGS</div><div class="stat">${money(d.cogs)}</div></div><div class="card"><div class="muted">Gross Profit</div><div class="stat">${money(Number(d.revenue)-Number(d.cogs))}</div></div><div class="card"><div class="muted">Net Profit</div><div class="stat">${money(Number(d.revenue)-Number(d.cogs)-Number(d.expenses))}</div></div></div>
 <br><div class="panel"><h3>Financial rule</h3><p>Capital is not revenue. Profit is Revenue − COGS − operating expenses. Distributions are tracked separately.</p></div>`;
}
async function settings(){
 const {data}=await sb.from('company_settings').select('*').single();
 content.innerHTML=`<div class="panel"><h3>Company Setup</h3><div class="formgrid"><div class="field"><label>Company</label><input id="company" value="${esc(data?.company_name||'CLEARON')}"></div><div class="field"><label>Owner</label><input id="owner" value="${esc(data?.owner_name||'Faizan')}"></div><div class="field"><label>Owner %</label><input id="opct" type="number" value="${data?.owner_pct??55}"></div><div class="field"><label>Partner %</label><input id="ppct" type="number" value="${data?.partner_pct??30}"></div><div class="field"><label>Investor %</label><input id="ipct" type="number" value="${data?.investor_pct??15}"></div><div class="field"><label>Reserve %</label><input id="rpct" type="number" value="${data?.reserve_pct??10}"></div></div><br><button onclick="saveSettings()">Save Settings</button></div>
 <br><div class="panel"><h3>Supabase connection</h3><p class="muted">This page uses only the Supabase URL + anon/publishable key. Never put a service-role key in this HTML.</p></div>`;
}
async function saveSettings(){
 const a=Number(opct.value),b=Number(ppct.value),c=Number(ipct.value);if(a+b+c!==100)return toast('Owner + Partner + Investor must equal 100%');
 const {error}=await sb.from('company_settings').update({company_name:company.value,owner_name:owner.value,owner_pct:a,partner_pct:b,investor_pct:c,reserve_pct:Number(rpct.value),updated_at:new Date().toISOString()}).not('id','is',null);
 toast(error?error.message:'Settings saved');if(!error)open('dashboard');
}
async function showForm(table){
 if(table==='customers')return miniForm('Customer','customers',[['name','Name'],['phone','Phone'],['address','Address'],['credit_limit','Credit Limit','number']]);
 if(table==='suppliers')return miniForm('Supplier','suppliers',[['name','Name'],['phone','Phone'],['address','Address']]);
 if(table==='employees')return miniForm('Employee','employees',[['name','Name'],['phone','Phone'],['designation','Designation'],['monthly_salary','Monthly Salary','number']]);
 if(table==='expenses')return miniForm('Expense','expenses',[['description','Description'],['amount','Amount','number']]);
 toast('Use the dedicated transaction buttons for financial records.');
}
function miniForm(label,table,fields){
 content.innerHTML=`<div class="panel"><h3>Add ${label}</h3><div class="formgrid">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]||'text'}"></div>`).join('')}</div><br><button onclick="saveMini('${table}',${JSON.stringify(fields)})">Save</button> <button class="secondary" onclick="open('${table==='customers'?'customers':table==='employees'?'people':'expenses'}')">Cancel</button></div>`;
}
async function saveMini(table,fields){
 const o={};fields.forEach(f=>o[f[0]]=document.getElementById('f_'+f[0]).value);if(table==='expenses'){toast('Expenses must use the transaction RPC with an account.');return}
 const {error}=await sb.from(table).insert(o);toast(error?error.message:'Saved');if(!error)open(table==='customers'?'customers':table==='employees'?'people':'expenses')
}
init();
</script>
</body>
</html>
