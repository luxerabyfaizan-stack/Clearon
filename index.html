<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEARON - Simple Business ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07111f,#174a78)}.loginbox{width:min(440px,94vw);background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 70px #0005}.brand{font-size:30px;font-weight:900;letter-spacing:2px}.muted{color:#718096}.small{font-size:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9e0ea;border-radius:9px;background:#fff}.primary{background:#1167d8;color:#fff;padding:10px 14px;border-radius:9px;font-weight:700}.success{background:#159447;color:#fff;padding:9px 12px;border-radius:8px}.danger{background:#d9363e;color:#fff;padding:9px 12px;border-radius:8px}.ghost{background:#eaf0f6;color:#26364a;padding:9px 12px;border-radius:8px}.linkbtn{background:none;color:#1167d8;padding:0}
#app{display:none}.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#0b1726;color:#d5dfeb;padding:16px;overflow:auto}.sidebrand{font-size:23px;font-weight:900;color:#fff;letter-spacing:2px;margin:5px 8px 20px}.nav button{display:block;width:100%;background:transparent;color:#c3cfdd;text-align:left;padding:9px 11px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#19304b;color:#fff}.main{margin-left:230px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.hamb{display:none;background:#0b1726;color:#fff;padding:9px;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e4e9ef;border-radius:13px;padding:16px;box-shadow:0 2px 12px #1422380a}.metric{font-size:23px;font-weight:900;margin-top:6px}.kpi-note{font-size:11px;color:#718096;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}.search{max-width:260px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#f7f9fc;font-size:11px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf3fa;font-size:11px;font-weight:700}.good{background:#e7f6ed;color:#126c39}.warn{background:#fff4dc;color:#8a5a00}.bad{background:#fde9e9;color:#a51d24}.modal{position:fixed;inset:0;background:#07111f99;display:grid;place-items:center;padding:14px;z-index:20}.modalbox{background:#fff;width:min(820px,96vw);max-height:94vh;overflow:auto;border-radius:15px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.right{text-align:right}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:50}.notice{padding:11px;background:#fff7df;border:1px solid #efd998;border-radius:9px;font-size:12px;margin-bottom:12px}.hero{font-size:14px;font-weight:800}.moneybig{font-size:28px;font-weight:900}.statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf0f4}.empty{text-align:center;padding:30px;color:#718096}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:30}.sidebar.open{transform:none}.main{margin-left:0;padding:15px}.hamb{display:block}.cards{grid-template-columns:1fr 1fr}.grid,.three{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:520px){.cards{grid-template-columns:1fr}.top h1{font-size:20px}}
</style>
</head>
<body>
<section id="login">
<div class="loginbox">
<div class="brand">CLEARON</div>
<div class="muted" style="margin:5px 0 20px">Simple Drinking Water Business System</div>
<div class="field"><label>Supabase Project URL</label><input id="sburl" placeholder="https://xxxx.supabase.co"></div>
<div class="field"><label>Publishable / Anon Key</label><input id="sbkey" type="password" placeholder="eyJ..."></div>
<div class="field"><label>Email</label><input id="email" type="email"></div>
<div class="field"><label>Password</label><input id="password" type="password"></div>
<button class="primary" style="width:100%" onclick="login()">Sign in</button>
<p class="small muted">Run the CLEARON SQL once in Supabase, then create an Auth user.</p>
</div>
</section>

<section id="app">
<aside class="sidebar" id="sidebar">
<div class="sidebrand">CLEARON</div>
<div class="nav" id="nav"></div>
<button class="ghost" style="width:100%;margin-top:12px" onclick="logout()">Logout</button>
</aside>
<main class="main">
<div class="top"><div style="display:flex;align-items:center;gap:9px"><button class="hamb" onclick="toggleSide()">Menu</button><h1 id="title">Dashboard</h1></div><div id="userbox" class="small muted"></div></div>
<div id="content"></div>
</main>
</section>

<div class="modal hidden" id="modal"><div class="modalbox"><div class="top"><h3 id="modalTitle">Form</h3><button class="ghost" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
let sb=null,profile=null,current='dashboard',cache={};
const modules=[
['dashboard','Dashboard'],['sales','Sales'],['purchases','Purchases'],['inventory','Inventory'],['production','Production'],['recipes','Production Recipe'],
['deliveries','Deliveries'],['customers','Customers'],['suppliers','Suppliers'],['products','Products'],['expenses','Expenses'],
['cash','Cash & Bank'],['capital','Investment & Funds'],['employees','Employees'],['reports','Profit & Reports'],['settings','Settings']
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'PKR '+Number(n||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',3200)}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function setContent(x){document.getElementById('content').innerHTML=x}
async function login(){
 try{
  const url=sburl.value.trim(),key=sbkey.value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))throw Error('Use the Supabase Project URL only, for example https://xxxx.supabase.co');
  localStorage.setItem('clearon.cfg',JSON.stringify({url,key}));
  sb=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error)throw error; await start(data.user);
 }catch(e){toast(e.message)}
}
async function start(user){
 const r=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(r.error)throw r.error;profile=r.data;
 loginSec(false);userbox.textContent=(profile.full_name||user.email)+' - '+profile.role;
 renderNav();await load(current);
}
function loginSec(show){document.getElementById('login').style.display=show?'grid':'none';document.getElementById('app').style.display=show?'none':'block'}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
function renderNav(){nav.innerHTML=modules.map(x=>`<button class="${x[0]===current?'active':''}" onclick="load('${x[0]}')">${x[1]}</button>`).join('')}
async function load(m){
 current=m;title.textContent=modules.find(x=>x[0]===m)?.[1]||m;renderNav();setContent('<div class="panel">Loading...</div>');
 try{await ({dashboard,sales,purchases,inventory,production,recipes,deliveries,customers,suppliers,products,expenses,cash,capital,employees,reports,settings}[m])();sidebar.classList.remove('open')}
 catch(e){console.error(e);setContent(`<div class="panel"><b>Could not load this section.</b><p class="muted">${esc(e.message)}</p><button class="primary" onclick="load(current)">Try Again</button></div>`)}
}
async function q(table,cols='*',order=null){
 let query=sb.from(table).select(cols);
 if(order)query=query.order(order,{ascending:false});
 let r=await query.limit(1000);
 if(r.error)throw r.error;
 return r.data||[]
}
async function rpc(fn,args){let r=await sb.rpc(fn,args);if(r.error)throw r.error;return r.data}
function table(rows,cols){
 if(!rows.length)return '<div class="empty">No records yet.</div>';
 return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
}
function btn(label,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function field(n,label,type='text',required=false,value=''){return `<div class="field"><label>${esc(label)}</label><input id="f_${n}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`}
function val(n){return document.getElementById('f_'+n)?.value}
function selectHtml(n,label,items,placeholder='Select...'){
 return `<div class="field"><label>${esc(label)}</label><select id="f_${n}"><option value="">${placeholder}</option>${items.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('')}</select></div>`
}
function closeModal(){modal.classList.add('hidden')}
async function openModal(titleText,body,saveFn){
 modal.classList.remove('hidden');modalTitle.textContent=titleText;modalBody.innerHTML=`<div class="formgrid">${body}</div><div class="right" style="margin-top:12px">${btn('Save',saveFn)}</div>`
}

async function dashboard(){
 const d=(await q('v_dashboard'))[0]||{},fund=(await q('v_funds'))[0]||{},settingsRow=(await q('company_settings'))[0]||{};
 const net=Number(d.revenue||0)-Number(d.cogs||0)-Number(d.expenses||0);
 const gross=Number(d.revenue||0)-Number(d.cogs||0);
 const assets=Number(d.cash_bank||0)+Number(d.inventory_value||0)+Number(d.receivables||0);
 const liabilities=Number(d.payables||0);
 const netAssets=assets-liabilities;
 const valuation=Math.max(0,netAssets,net*12*Number(settingsRow.valuation_multiple||4)/4);
 const available=Math.max(0,Number(d.cash_bank||0)-Number(d.payables||0));
 setContent(`
 <div class="cards">
  <div class="card"><div class="muted">Today's / Current Sales</div><div class="metric">${money(d.revenue)}</div><div class="kpi-note">Posted sales</div></div>
  <div class="card"><div class="muted">Gross Profit</div><div class="metric">${money(gross)}</div><div class="kpi-note">Sales minus product cost</div></div>
  <div class="card"><div class="muted">Net Profit</div><div class="metric">${money(net)}</div><div class="kpi-note">After operating expenses</div></div>
  <div class="card"><div class="muted">Cash + Bank</div><div class="metric">${money(d.cash_bank)}</div><div class="kpi-note">Recorded cash position</div></div>
 </div>
 <div class="cards" style="margin-top:12px">
  <div class="card"><div class="muted">Inventory Value</div><div class="metric">${money(d.inventory_value)}</div></div>
  <div class="card"><div class="muted">Customer Receivable</div><div class="metric">${money(d.receivables)}</div></div>
  <div class="card"><div class="muted">Supplier Payable</div><div class="metric">${money(d.payables)}</div></div>
  <div class="card"><div class="muted">Total Investment</div><div class="metric">${money(d.net_investment)}</div></div>
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="panel"><h3>Money available to use</h3><div class="moneybig">${money(available)}</div><p class="muted small">Cash + bank less supplier/customer-related short-term payable shown by the system. Keep a reserve for salaries, utilities and upcoming bills.</p>
   <div class="statline"><span>Total investment put in</span><b>${money(d.net_investment)}</b></div>
   <div class="statline"><span>Cash + bank</span><b>${money(d.cash_bank)}</b></div>
   <div class="statline"><span>Inventory</span><b>${money(d.inventory_value)}</b></div>
  </div>
  <div class="panel"><h3>Business value estimate</h3><div class="moneybig">${money(valuation)}</div><p class="muted small">Management estimate based on net assets / profit multiple. It is not a guaranteed market selling price.</p>
   <div class="statline"><span>Net assets</span><b>${money(netAssets)}</b></div>
   <div class="statline"><span>Annualized current net profit</span><b>${money(net*12)}</b></div>
  </div>
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="panel"><h3>Quick actions</h3><div class="toolbar">${btn('New Sale',"openSale()")}${btn('New Purchase',"openPurchase()")}${btn('Add Stock',"openInventory()")}${btn('Expense',"openExpense()")}${btn('Receive Payment',"openPayment()")}</div></div>
  <div class="panel"><h3>Ownership</h3><div class="statline"><span>${esc(settingsRow.owner_name||'Owner')}</span><b>${settingsRow.owner_pct||55}%</b></div><div class="statline"><span>${esc(settingsRow.partner_name||'Working Partner')}</span><b>${settingsRow.partner_pct||30}%</b></div><div class="statline"><span>Investor Pool</span><b>${settingsRow.investor_pct||15}%</b></div></div>
 </div>`)
}

async function customers(){
 const rows=await q('v_customer_balances');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Customer',"openCustomer()")}<button class="ghost" onclick="load('customers')">Refresh</button></div>${table(rows,[{label:'Code',k:'code'},{label:'Customer',k:'name'},{label:'Phone',k:'phone'},{label:'Credit Limit',k:'credit_limit',f:r=>money(r.credit_limit)},{label:'Balance',k:'balance',f:r=>money(r.balance)},{label:'Action',k:'id',f:r=>btn('Payment',`openPayment('${r.id}')`,'success')}])}</div>`)
}
async function suppliers(){
 const rows=await q('v_supplier_balances');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Supplier',"openSupplier()")}<button class="ghost" onclick="load('suppliers')">Refresh</button></div>${table(rows,[{label:'Code',k:'code'},{label:'Supplier',k:'name'},{label:'Phone',k:'phone'},{label:'Balance',k:'balance',f:r=>money(r.balance)},{label:'Action',k:'id',f:r=>btn('Pay Supplier',`openSupplierPayment('${r.id}')`,'success')}])}</div>`)
}
async function products(){
 const rows=await q('products');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Product',"openProduct()")}<button class="ghost" onclick="load('products')">Refresh</button></div><div class="notice">You manage SKU and product name. Database UUIDs are hidden and automatic.</div>${table(rows,[{label:'SKU',k:'sku'},{label:'Product',k:'name'},{label:'Size',k:'size_ml',f:r=>r.size_ml?r.size_ml+' ml':'-'},{label:'Sale Price',k:'sale_price',f:r=>money(r.sale_price)},{label:'Cost',k:'cost_price',f:r=>money(r.cost_price)},{label:'Reorder',k:'reorder_level'},{label:'Status',k:'active',f:r=>r.active?'<span class="badge good">Active</span>':'<span class="badge">Archived</span>'},{label:'Action',k:'id',f:r=>r.active?btn('Archive',`archiveProduct('${r.id}')`,'danger'):btn('Activate',`activateProduct('${r.id}')`,'success')}])}</div>`)
}
async function inventory(){
 const rows=await q('v_inventory');
 setContent(`<div class="panel"><div class="toolbar">${btn('Add Stock',"openInventory()")}${btn('Remove / Adjust Stock',"openInventory(-1)",'ghost')}<button class="ghost" onclick="load('inventory')">Refresh</button></div>${table(rows,[{label:'SKU',k:'sku'},{label:'Product',k:'product_name'},{label:'Location',k:'location_name'},{label:'Quantity',k:'qty'},{label:'Average Cost',k:'avg_cost',f:r=>money(r.avg_cost)},{label:'Stock Value',k:'stock_value',f:r=>money(r.stock_value)},{label:'Status',k:'stock_status',f:r=>r.stock_status==='LOW'?'<span class="badge warn">LOW STOCK</span>':'<span class="badge good">OK</span>'}])}</div>`)
}
async function sales(){
 const rows=await q('sales_orders');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Sale',"openSale()")}<button class="ghost" onclick="load('sales')">Refresh</button></div>${table(rows,[{label:'Sale',k:'order_no'},{label:'Date',k:'order_date'},{label:'Customer',k:'customer_id',f:r=>customerName(r.customer_id)},{label:'Total',k:'total',f:r=>money(r.total)},{label:'Paid',k:'paid',f:r=>money(r.paid)},{label:'Due',k:'due',f:r=>money(r.due)},{label:'Status',k:'status',f:r=>`<span class="badge">${esc(r.status)}</span>`},{label:'Action',k:'id',f:r=>r.status==='draft'?btn('Post Sale',`postSale('${r.id}')`,'success'):''}])}</div>`)
}
async function purchases(){
 const rows=await q('purchase_orders');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Purchase',"openPurchase()")}<button class="ghost" onclick="load('purchases')">Refresh</button></div>${table(rows,[{label:'Purchase',k:'po_no'},{label:'Date',k:'order_date'},{label:'Supplier',k:'supplier_id',f:r=>supplierName(r.supplier_id)},{label:'Total',k:'total',f:r=>money(r.total)},{label:'Status',k:'status',f:r=>`<span class="badge">${esc(r.status)}</span>`},{label:'Action',k:'id',f:r=>r.status==='draft'?btn('Receive Stock',`receivePurchase('${r.id}')`,'success'):''}])}</div>`)
}
async function production(){
 const rows=await q('production_batches');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Production',"openProduction()")}<button class="ghost" onclick="load('production')">Refresh</button></div>${table(rows,[{label:'Batch',k:'batch_no'},{label:'Date',k:'production_date'},{label:'Product',k:'product_id',f:r=>productName(r.product_id)},{label:'Planned',k:'planned_qty'},{label:'Produced',k:'produced_qty'},{label:'Status',k:'status',f:r=>`<span class="badge">${esc(r.status)}</span>`},{label:'Action',k:'id',f:r=>r.status==='planned'?btn('Complete',`completeProduction('${r.id}')`,'success'):''}])}</div>`)
}
async function recipes(){
 const boms=await q('boms');
 const lines=await q('bom_lines');
 await loadCache();
 setContent(`<div class="panel"><div class="toolbar">${btn('Add Recipe Line',"openRecipe()")}<button class="ghost" onclick="load('recipes')">Refresh</button></div>
 <div class="notice">Optional: use this only if production should automatically consume bottles, caps, labels, water or other materials. Quantity is the material used for one yield unit.</div>
 ${table(lines,[{label:'Finished Product',k:'bom_id',f:r=>{let b=boms.find(x=>x.id===r.bom_id);return b?productName(b.product_id):'-'}},{label:'Material',k:'material_product_id',f:r=>productName(r.material_product_id)},{label:'Qty per Yield',k:'qty_per_yield'},{label:'Action',k:'id',f:r=>btn('Delete',`deleteRecipe('${r.id}')`,'danger')}])}</div>`)
}
async function openRecipe(){
 await loadCache();
 const products=cache.products.filter(x=>x.active);
 const body=selectHtml('bom_product_id','Finished Product',products.map(x=>({id:x.id,label:x.sku+' - '+x.name})))+
 selectHtml('material_product_id','Material',products.map(x=>({id:x.id,label:x.sku+' - '+x.name})))+
 field('qty_per_yield','Material Quantity per 1 Yield','number',true)+field('yield_qty','Yield Quantity','number',true,'1');
 await openModal('Add Production Recipe',body,'saveRecipe()')
}
async function saveRecipe(){
 try{
  const product=val('bom_product_id'),material=val('material_product_id');
  let bom=(await sb.from('boms').select('*').eq('product_id',product).maybeSingle()).data;
  if(!bom){let r=await sb.from('boms').insert({product_id:product,yield_qty:Number(val('yield_qty')||1),active:true}).select().single();if(r.error)throw r.error;bom=r.data}
  let r=await sb.from('bom_lines').insert({bom_id:bom.id,material_product_id:material,qty_per_yield:Number(val('qty_per_yield'))});if(r.error)throw r.error;
  closeModal();toast('Recipe saved');load('recipes')
 }catch(e){toast(e.message)}
}
async function deleteRecipe(id){if(!confirm('Delete this recipe line?'))return;let r=await sb.from('bom_lines').delete().eq('id',id);if(r.error)toast(r.error.message);else load('recipes')}

async function deliveries(){
 const rows=await q('deliveries');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Delivery',"openDelivery()")}<button class="ghost" onclick="load('deliveries')">Refresh</button></div>${table(rows,[{label:'Delivery',k:'delivery_no'},{label:'Date',k:'delivery_date'},{label:'Order',k:'sales_order_id',f:r=>orderName(r.sales_order_id)},{label:'Driver',k:'driver_name'},{label:'Vehicle',k:'vehicle_no'},{label:'Route',k:'route'},{label:'Status',k:'status'}])}</div>`)
}
async function expenses(){
 const rows=await q('expenses');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Expense',"openExpense()")}<button class="ghost" onclick="load('expenses')">Refresh</button></div>${table(rows,[{label:'Expense',k:'expense_no'},{label:'Date',k:'expense_date'},{label:'Category',k:'category'},{label:'Description',k:'description'},{label:'Amount',k:'amount',f:r=>money(r.amount)},{label:'Paid From',k:'payment_method'}])}</div>`)
}
async function cash(){
 const rows=await q('cash_entries');
 setContent(`<div class="panel"><div class="toolbar">${btn('New Cash Entry',"openCash()")}<button class="ghost" onclick="load('cash')">Refresh</button></div>${table(rows,[{label:'Date',k:'entry_date'},{label:'Account',k:'account'},{label:'Type',k:'entry_type'},{label:'Amount',k:'amount',f:r=>money(r.amount)},{label:'Description',k:'description'}])}</div>`)
}
async function capital(){
 const rows=await q('capital_ledger');
 const sums=await q('v_capital_summary');
 const fund=(await q('v_funds'))[0]||{};
 setContent(`<div class="cards"><div class="card"><div class="muted">Total Investment</div><div class="metric">${money(fund.total_investment)}</div></div><div class="card"><div class="muted">Withdrawn</div><div class="metric">${money(fund.total_withdrawal)}</div></div><div class="card"><div class="muted">Net Investment</div><div class="metric">${money(Number(fund.total_investment||0)-Number(fund.total_withdrawal||0))}</div></div><div class="card"><div class="muted">Inventory Value</div><div class="metric">${money(fund.inventory_value)}</div></div></div>
 <div class="panel" style="margin-top:14px"><div class="toolbar">${btn('Add Investment',"openCapital()")}<button class="ghost" onclick="load('capital')">Refresh</button></div>${table(rows,[{label:'Date',k:'entry_date'},{label:'Party',k:'party_name'},{label:'Type',k:'entry_type'},{label:'Amount',k:'amount',f:r=>money(r.amount)},{label:'Note',k:'note'}])}</div>

async function reports(){
 const d=(await q('v_dashboard'))[0]||{},fund=(await q('v_funds'))[0]||{},set=(await q('company_settings'))[0]||{};
 const gross=Number(d.revenue||0)-Number(d.cogs||0),net=gross-Number(d.expenses||0);
 const valuation=Math.max(0,(Number(d.cash_bank||0)+Number(d.inventory_value||0)+Number(d.receivables||0)-Number(d.payables||0)),net*12*Number(set.valuation_multiple||4)/4);
 setContent(`<div class="grid">
 <div class="panel"><h3>Profit & Loss</h3><div class="statline"><span>Revenue</span><b>${money(d.revenue)}</b></div><div class="statline"><span>COGS</span><b>${money(d.cogs)}</b></div><div class="statline"><span>Gross Profit</span><b>${money(gross)}</b></div><div class="statline"><span>Operating Expenses</span><b>${money(d.expenses)}</b></div><div class="statline"><span>Net Profit</span><b>${money(net)}</b></div></div>
 <div class="panel"><h3>Company Position</h3><div class="statline"><span>Cash + Bank</span><b>${money(d.cash_bank)}</b></div><div class="statline"><span>Inventory</span><b>${money(d.inventory_value)}</b></div><div class="statline"><span>Receivables</span><b>${money(d.receivables)}</b></div><div class="statline"><span>Payables</span><b>${money(d.payables)}</b></div><div class="statline"><span>Net Assets</span><b>${money(Number(d.cash_bank||0)+Number(d.inventory_value||0)+Number(d.receivables||0)-Number(d.payables||0))}</b></div><div class="statline"><span>Estimated Business Value</span><b>${money(valuation)}</b></div></div>
 </div>
 <div class="panel" style="margin-top:14px"><h3>What you can see here</h3><p class="muted">Sales, product costs, expenses, receivables, supplier payables, inventory value, cash/bank, total investment and an estimated business value all come from saved database records.</p></div>`)

async function saveSettings(){
 try{
  const a=Number(val('owner_pct')),b=Number(val('partner_pct')),c=Number(val('investor_pct'));
  if(Math.abs(a+b+c-100)>0.001)throw Error('Ownership percentages must total 100%.');
  const old=(await q('company_settings'))[0];
  const r=await sb.from('company_settings').update({company_name:val('company_name'),owner_name:val('owner_name'),owner_pct:a,partner_name:val('partner_name'),partner_pct:b,investor_pct:c,reserve_pct:Number(val('reserve_pct')||0),valuation_multiple:Number(val('valuation_multiple')||4),opening_cash:Number(val('opening_cash')||0),opening_bank:Number(val('opening_bank')||0),updated_at:new Date().toISOString()}).eq('id',old.id);
  if(r.error)throw r.error;toast('Settings saved');load('settings')
 }catch(e){toast(e.message)}
}

 }catch(e){toast(e.message)}
}
